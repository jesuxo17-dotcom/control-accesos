<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Zoom desactivado a propósito: es un kiosco de pantalla fija -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kiosco de acceso</title>
<!-- IBM Plex Sans/Mono; sin internet se usa la fuente del sistema (la demo sigue funcionando) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   KIOSCO - estilos
   Sistema de diseño (ui-ux-pro-max): Minimalism & Swiss,
   IBM Plex Sans, fondo azul noche, colores semánticos de
   pantalla completa y movimiento sutil (respeta reduced-motion).
   Letras grandes (se miden en vw para que se lean a 2 metros
   sin importar el tamaño de la pantalla) y alto contraste
   (texto blanco >= 4.5:1 sobre cada color de resultado).
   ========================================================= */
:root{
  --noche:#0b1120; --linea:rgba(148,163,184,.18);
  --texto:#f8fafc; --suave:#a5b4c8;
  --azul:#3b82f6; --azul-claro:#93c5fd;
  --ok:#22c55e; --mal:#ef4444;
  --verde-a:#15803d; --verde-b:#14532d;   /* blanco 5.0:1 / 9.9:1 */
  --rojo-a:#b91c1c;  --rojo-b:#7f1d1d;    /* blanco 6.5:1 / 9.8:1 */
  --ambar-a:#b45309; --ambar-b:#78350f;   /* blanco 5.0:1 / 9.6:1 */
  --fuente:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --curva:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--noche);color:var(--texto);
  font-family:var(--fuente);-webkit-font-smoothing:antialiased;
  cursor:none;                 /* sin cursor: es un kiosco */
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* Cada "pantalla" ocupa todo; solo una tiene la clase .activa */
.pantalla{
  position:fixed;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  /* abajo deja lugar para el estado, el botón de modo y el reloj */
  text-align:center;padding:9vh 4vw 16vh;gap:min(2.2vw,3vh);
}
/* Los tamaños usan min(vw, vh): así caben también en pantallas anchas pero
   bajitas (laptop con la ventana del navegador, no en pantalla completa). */
.pantalla.activa{display:flex}

/* ---------- Pantalla de espera ---------- */
#pantalla-espera{
  background:radial-gradient(60vw 50vh at 50% 0%, rgba(59,130,246,.16), transparent 70%), var(--noche);
}
/* rejilla sutil de fondo (estilo suizo) */
#pantalla-espera::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
  background-size:6vw 6vw;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 10%,transparent 65%);
          mask-image:radial-gradient(ellipse at center,#000 10%,transparent 65%);
}
#pantalla-espera > *{position:relative}
.titulo{font-size:clamp(36px,min(8vw,10vh),160px);font-weight:700;line-height:1.02;letter-spacing:-.035em}
.subtitulo{display:flex;gap:1vw;justify-content:center;flex-wrap:wrap}
.subtitulo span{
  font-size:clamp(16px,min(2.4vw,3.4vh),46px);font-weight:500;color:var(--suave);
  padding:.5vw 1.6vw;border:max(2px,.15vw) solid var(--linea);border-radius:999px;
  display:inline-flex;align-items:center;gap:.8vw;
}
.subtitulo svg{width:1.1em;height:1.1em}

/* Marco de escaneo: credencial dentro de esquinas tipo visor, con línea que recorre */
.icono{
  width:clamp(120px,min(22vw,30vh),380px);aspect-ratio:1/1;position:relative;
  display:grid;place-items:center;margin-bottom:1vw;
}
.icono svg.credencial{width:62%;height:auto;display:block;color:var(--texto)}
.esquinas{position:absolute;inset:0;color:var(--azul)}
.esquinas svg{width:100%;height:100%;display:block}
.escaneo{
  position:absolute;left:12%;right:12%;height:max(3px,.3vw);border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--azul-claro),transparent);
  box-shadow:0 0 2vw .3vw rgba(59,130,246,.55);
  animation:barrido 2.6s var(--curva) infinite alternate;
}
@keyframes barrido{from{top:14%}to{top:84%}}

/* Barras inferiores: estado del lector (izq.), botón de modo (centro), reloj (der.) */
.reloj{position:fixed;right:3vw;bottom:2.6vw;text-align:right;color:var(--suave)}
.reloj .hora{font-family:var(--mono);font-size:clamp(28px,4vw,76px);font-weight:600;color:var(--texto);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.reloj .fecha{font-size:clamp(14px,1.6vw,30px);margin-top:.4vw}
.reloj .fecha::first-letter{text-transform:uppercase}

/* Indicador de estado del lector.
   Verde = el input oculto tiene el foco y el lector puede escribir. */
.estado{
  position:fixed;left:3vw;bottom:2.6vw;display:flex;align-items:center;gap:.9vw;
  font-size:clamp(14px,1.6vw,30px);font-weight:500;color:var(--suave);
  padding:.6vw 1.4vw;border-radius:999px;background:rgba(15,23,42,.7);border:max(1px,.1vw) solid var(--linea);
}
.punto{width:1.1vw;height:1.1vw;min-width:12px;min-height:12px;border-radius:50%;background:var(--mal)}
.punto.ok{background:var(--ok);animation:latido 2s ease-out infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 1.2vw rgba(34,197,94,0)}}

/* ---------- PASO 4: pantalla de resultado ----------
   Todo el fondo cambia de color para que el guardia lo vea de lejos:
   verde = pasa, rojo = rechazado, ámbar = externo o repetido. */
#pantalla-resultado{transition:background .15s;padding-top:6vh;padding-bottom:12vh}
#pantalla-resultado.verde{background:radial-gradient(90vw 80vh at 50% 20%,var(--verde-a),var(--verde-b))}
#pantalla-resultado.rojo{background:radial-gradient(90vw 80vh at 50% 20%,var(--rojo-a),var(--rojo-b))}
#pantalla-resultado.ambar{background:radial-gradient(90vw 80vh at 50% 20%,var(--ambar-a),var(--ambar-b))}
#pantalla-resultado.cargando{background:var(--noche)}

/* Icono en un círculo blanco con el color del resultado (forma + color, no solo color) */
.res-icono{
  width:clamp(64px,min(12vw,13vh),220px);height:clamp(64px,min(12vw,13vh),220px);border-radius:50%;
  display:grid;place-items:center;background:#fff;
  box-shadow:0 0 0 1.4vw rgba(255,255,255,.14);
  animation:pop .32s var(--curva);
}
.res-icono svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.verde .res-icono{color:var(--verde-a)}
.rojo  .res-icono{color:var(--rojo-a)}
.ambar .res-icono{color:var(--ambar-a)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
/* Verificando: anillo que gira */
.cargando .res-icono{background:transparent;box-shadow:none;animation:none}
.girador{width:100%;height:100%;border-radius:50%;
  border:max(6px,.7vw) solid rgba(255,255,255,.15);border-top-color:var(--azul);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.res-titulo{font-size:clamp(36px,min(7.5vw,10vh),150px);font-weight:700;line-height:1;letter-spacing:-.035em;
  animation:sube .3s var(--curva)}
@keyframes sube{from{opacity:0;transform:translateY(1.2vw)}}

/* Tarjeta de la persona: panel translúcido sobre el color */
.res-persona{
  display:flex;align-items:center;gap:2.6vw;max-width:92vw;
  padding:min(1.6vw,2vh) 3vw min(1.6vw,2vh) min(1.6vw,2vh);border-radius:2.4vw;
  background:rgba(0,0,0,.2);border:max(1px,.12vw) solid rgba(255,255,255,.16);
  animation:sube .36s var(--curva);
}
.res-foto{width:clamp(72px,min(14vw,16vh),280px);height:clamp(72px,min(14vw,16vh),280px);border-radius:50%;
  object-fit:cover;border:max(3px,.4vw) solid #fff;background:#1e293b;flex-shrink:0}
.res-nombre{font-size:clamp(24px,min(4.4vw,6.2vh),88px);font-weight:700;text-align:left;line-height:1.08;letter-spacing:-.02em}
.res-detalle{font-size:clamp(16px,min(2.4vw,3.4vh),46px);color:rgba(255,255,255,.88);text-align:left;margin-top:.6vw}
.res-motivo{font-size:clamp(18px,min(3.2vw,4.4vh),62px);font-weight:600;background:rgba(0,0,0,.24);
  padding:.8vw 2.4vw;border-radius:1.4vw;max-width:92vw}
.res-hora{font-family:var(--mono);font-size:clamp(18px,2.2vw,42px);color:rgba(255,255,255,.85);
  font-variant-numeric:tabular-nums}
/* Permiso nocturno vigente (campo "permiso" de /api/scan) */
.res-permiso{font-size:clamp(16px,min(2.8vw,4vh),54px);font-weight:600;background:#312e81;color:#e0e7ff;
  padding:.8vw 2.4vw;border-radius:999px;display:none;align-items:center;gap:1vw;
  border:max(1px,.12vw) solid rgba(199,210,254,.35)}
.res-permiso svg{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Etiqueta con el kiosco y el modo (arriba a la izquierda) */
.etiqueta-kiosco{
  position:fixed;left:3vw;top:2.6vw;
  font-family:var(--mono);font-size:clamp(13px,1.5vw,28px);font-weight:500;color:var(--suave);
  padding:.5vw 1.3vw;border-radius:999px;background:rgba(15,23,42,.7);border:max(1px,.1vw) solid var(--linea);
}
.etiqueta-kiosco:empty{display:none}

/* ---------- Cámara (paso 3) ---------- */
#camara{
  display:none;width:min(58vh,80vw);aspect-ratio:1/1;
  border:max(3px,.4vw) solid var(--azul);border-radius:2.4vw;overflow:hidden;background:#000;
  box-shadow:0 0 0 1.2vw rgba(59,130,246,.15);
}
#camara video{width:100%!important;height:100%!important;object-fit:cover}
body.modo-camara #camara{display:block}
body.modo-camara .icono{display:none}

/* Botón para alternar Lector USB / Cámara (abajo al centro) */
.boton-modo{
  position:fixed;left:50%;bottom:2.4vw;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:.9vw;min-height:48px;
  background:rgba(30,41,59,.85);color:var(--texto);border:max(2px,.15vw) solid #475569;border-radius:999px;
  font:inherit;font-weight:600;font-size:clamp(16px,1.9vw,36px);padding:.9vw 2.6vw;
  cursor:pointer!important;   /* el body oculta el cursor; aquí sí lo mostramos */
  transition:background .15s,border-color .15s,opacity .15s;
}
.boton-modo svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.boton-modo:hover{border-color:var(--azul)}
.boton-modo:active{background:#334155}
.boton-modo:focus-visible{outline:3px solid var(--azul-claro);outline-offset:3px}
/* Durante el resultado se ocultan los controles para que nada distraiga */
body.mostrando .boton-modo{opacity:0;pointer-events:none}

/* Aviso de errores de cámara */
.aviso{
  position:fixed;top:2.4vw;left:50%;transform:translateX(-50%);max-width:90vw;
  background:#7f1d1d;color:#fff;border:max(1px,.12vw) solid rgba(255,255,255,.2);border-radius:1.2vw;
  padding:1vw 2.5vw;font-size:clamp(16px,1.9vw,36px);font-weight:500;text-align:center;display:none;
}
.aviso.visible{display:block}

/* Pantallas angostas (tablet vertical): el botón sube para no chocar con estado y reloj */
@media (max-aspect-ratio:4/5){
  .boton-modo{bottom:calc(2.6vw + 9vh)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .escaneo{animation:none;top:49%}
}

/* ---------- Input oculto para el lector USB ----------
   NO usamos display:none porque un elemento oculto así no puede
   recibir foco. Lo dejamos invisible pero presente. */
#lector{
  position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;
  border:0;outline:0;background:transparent;
}
</style>
</head>
<body>

<!-- PASO 1: pantalla de espera -->
<section id="pantalla-espera" class="pantalla activa">
  <div class="icono" aria-hidden="true">
    <!-- Esquinas tipo visor -->
    <div class="esquinas">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <path d="M4 22V12a8 8 0 0 1 8-8h10M78 4h10a8 8 0 0 1 8 8v10M96 78v10a8 8 0 0 1-8 8H78M22 96H12a8 8 0 0 1-8-8V78"/>
      </svg>
    </div>
    <svg class="credencial" viewBox="0 0 200 130" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <rect x="8" y="8" width="184" height="114" rx="14"/>
      <circle cx="60" cy="52" r="16"/>
      <path d="M34 98c4-16 16-24 26-24s22 8 26 24"/>
      <path d="M112 44h56M112 66h56M112 88h36"/>
    </svg>
    <div class="escaneo"></div>
  </div>
  <!-- PASO 3: aquí html5-qrcode dibuja el video de la cámara -->
  <div id="camara"></div>
  <h1 class="titulo">Acerca tu credencial</h1>
  <p class="subtitulo">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>Código QR</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"/></svg>Código de barras</span>
  </p>
</section>

<!-- PASO 4: pantalla de resultado (la llena mostrarResultado()) -->
<section id="pantalla-resultado" class="pantalla" aria-live="assertive">
  <div class="res-icono" id="res-icono" aria-hidden="true"></div>
  <div class="res-titulo" id="res-titulo"></div>
  <div class="res-persona" id="res-persona">
    <img class="res-foto" id="res-foto" alt="">
    <div>
      <div class="res-nombre" id="res-nombre"></div>
      <div class="res-detalle" id="res-detalle"></div>
    </div>
  </div>
  <div class="res-motivo" id="res-motivo"></div>
  <div class="res-permiso" id="res-permiso"></div>
  <div class="res-hora" id="res-hora"></div>
</section>

<!-- Kiosco y modo configurados (se cambian con ?kiosco=K-PUERTA1&modo=entrada) -->
<div class="etiqueta-kiosco" id="etiqueta-kiosco"></div>

<!-- PASO 3: botón para alternar entre lector USB y cámara, y aviso de errores -->
<button class="boton-modo" id="boton-modo" type="button">Usar cámara</button>
<div class="aviso" id="aviso" role="alert"></div>

<!-- Reloj y estado del lector -->
<div class="estado" role="status"><span class="punto" id="punto"></span><span id="estado-texto">Revisando lector…</span></div>
<div class="reloj"><div class="hora" id="hora"></div><div class="fecha" id="fecha"></div></div>

<!-- PASO 2: input oculto. inputmode="none" evita que salga el teclado en tablets -->
<input id="lector" type="text" inputmode="none" autocomplete="off" autocapitalize="off"
       autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1" autofocus>


<!-- Librería local (kiosco/lib/): así la demo funciona aunque no haya internet -->
<script src="lib/html5-qrcode.min.js"></script>

<script>
/* =========================================================
   KIOSCO - lógica (pasos 1, 2 y 3)
   ========================================================= */

const $ = (id) => document.getElementById(id);
const lector = $('lector');

/* Cambia de pantalla: solo la que tenga ese id queda activa */
function mostrar(id) {
  document.querySelectorAll('.pantalla').forEach((p) => {
    p.classList.toggle('activa', p.id === id);
  });
}

/* ---------- Reloj (zona horaria de Mazatlán) ---------- */
function actualizarReloj() {
  const ahora = new Date();
  $('hora').textContent = ahora.toLocaleTimeString('es-MX', {
    hour: '2-digit', minute: '2-digit', timeZone: 'America/Mazatlan'
  });
  $('fecha').textContent = ahora.toLocaleDateString('es-MX', {
    weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Mazatlan'
  });
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

/* ---------- Foco permanente del input del lector ----------
   El lector USB funciona como un teclado: "escribe" el código y
   manda Enter. Si el input pierde el foco, lo escrito se pierde,
   así que lo recuperamos en cuanto pase cualquier cosa. */
let bloquearFoco = false; // el menú oculto (paso 6) lo pondrá en true mientras esté abierto

function enfocar() {
  if (!bloquearFoco && document.activeElement !== lector) {
    lector.focus({ preventScroll: true });
  }
  // El punto verde indica que el lector realmente puede escribir
  const listo = document.activeElement === lector && document.hasFocus();
  $('punto').classList.toggle('ok', listo);
  $('estado-texto').textContent = listo ? 'Lector listo' : 'Toca la pantalla para activar el lector';
}

lector.addEventListener('blur', () => setTimeout(enfocar, 10)); // se perdió el foco: recuperarlo
document.addEventListener('click', enfocar);
document.addEventListener('touchstart', enfocar, { passive: true });
window.addEventListener('focus', enfocar);
document.addEventListener('visibilitychange', enfocar);
setInterval(enfocar, 1000); // red de seguridad
enfocar();

/* ---------- Pantalla completa ----------
   El navegador solo la permite después de un toque/clic del usuario.
   Para la demo es mejor F11 o abrir Chrome con --kiosk. */
let yaPidioPantallaCompleta = false;
document.addEventListener('click', () => {
  if (yaPidioPantallaCompleta) return;
  yaPidioPantallaCompleta = true;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});

/* ---------- Lectura del código del lector USB ----------
   El lector escribe muy rápido (menos de 100 ms entre teclas).
   Si pasa más de 500 ms desde la última tecla, borramos lo anterior:
   así una tecla suelta no se mezcla con el siguiente escaneo. */
let ultimaTecla = 0;

lector.addEventListener('keydown', (e) => {
  const ahora = Date.now();

  if (e.key === 'Enter') {
    e.preventDefault();
    const codigo = lector.value.trim();
    lector.value = '';
    if (codigo) procesarCodigo(codigo, 'lector');
    return;
  }

  if (ahora - ultimaTecla > 500) lector.value = '';
  ultimaTecla = ahora;
});

/* =========================================================
   PASO 4: enviar el código a POST /api/scan y mostrar el resultado
   ========================================================= */

/* localStorage puede fallar (incógnito, bloqueado): nunca debe tumbar el kiosco */
function leerLS(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }
function guardarLS(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) {} }

/* Configuración del kiosco. Se pasa una vez por la URL y se recuerda:
     kiosco/index.html?kiosco=K-PUERTA1&modo=entrada
   modo: "entrada" | "salida" | "mixto" (por defecto mixto) */
const params = new URLSearchParams(location.search);
const MODOS = ['entrada', 'salida', 'mixto'];
const KIOSCO_ID = params.get('kiosco') || leerLS('kiosco_id') || 'K-PUERTA1';
const MODO = MODOS.includes(params.get('modo')) ? params.get('modo')
           : (MODOS.includes(leerLS('kiosco_modo')) ? leerLS('kiosco_modo') : 'mixto');
guardarLS('kiosco_id', KIOSCO_ID);
guardarLS('kiosco_modo', MODO);
$('etiqueta-kiosco').textContent = `${KIOSCO_ID} · modo ${MODO}`;

/* Textos grandes que se muestran según el resultado y el motivo */
const TITULOS = { ingreso: 'Bienvenido', egreso: 'Hasta pronto', rechazado: 'Acceso denegado', repetido: 'Ya registrado' };
/* Iconos SVG (estilo Lucide). Son textos fijos, nunca datos del servidor */
const ICONOS  = {
  verde: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  rojo:  '<svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  ambar: '<svg viewBox="0 0 24 24"><path d="M12 7v6"/><path d="M12 17.5h.01"/></svg>'
};
const ICONO_LUNA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
const ICONO_CAMARA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>';
const ICONO_LECTOR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>';
const MOTIVOS = {
  no_registrada:  'Credencial no registrada',
  inactiva:       'Credencial inactiva — acude a Servicios Escolares',
  externo:        'Visitante externo — pendiente de confirmar',
  repetido:       'Ya se registró hace unos segundos',
  ya_dentro:      'Ya estás dentro — usa el kiosco de salida',
  sin_conexion:   'Sin conexión con el servidor — avisa al guardia',
  codigo_vencido: 'Código QR vencido o ya usado — genera uno nuevo'
};
/* El servidor contesta {resultado:"rechazado", motivo:null} cuando un kiosco de
   SALIDA lee a alguien sin entrada registrada (motivo interno "sin_ingreso"). */
const MOTIVO_SIN_INGRESO = 'No hay entrada registrada — usa el kiosco de entrada';
/* Tiempo en pantalla: los rechazos se quedan un poco más para que se lean */
const DURACION = { verde: 2500, ambar: 3500, rojo: 4000 };
const TIEMPO_MAX_SERVIDOR = 5000; // ms; si el servidor no contesta, mostramos error

let temporizador = null;
let ocupado = false; // true mientras se procesa/muestra un resultado: ignora lecturas nuevas

/* Avatar con iniciales (sin internet) cuando el usuario no tiene foto */
function avatar(nombre) {
  const ini = String(nombre || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#334155"/>` +
    `<text x="50%" y="54%" font-family="Arial" font-size="80" fill="#fff" text-anchor="middle" dominant-baseline="middle">${ini}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* Pequeño sonido distinto para aceptado / rechazado (Web Audio, sin archivos) */
let audio = null;
function pitido(color) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const tonos = color === 'verde' ? [880] : color === 'ambar' ? [660, 660] : [220, 180];
    tonos.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = color === 'rojo' ? 'square' : 'sine';
      g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime + i * 0.18;
      o.start(t); o.stop(t + 0.14);
    });
  } catch (e) { /* sin audio no pasa nada */ }
}

/* Pinta la respuesta de /api/scan:
   {resultado, color, motivo, usuario:{id,nombre,foto_url,carrera,grupo,tipo}|null, fecha_hora} */
function mostrarResultado(r) {
  const color = ['verde', 'rojo', 'ambar'].includes(r.color) ? r.color : 'rojo';
  const pantalla = $('pantalla-resultado');
  pantalla.className = 'pantalla activa ' + color;

  $('res-icono').innerHTML = ICONOS[color];
  $('res-titulo').textContent = TITULOS[r.resultado] || 'Acceso denegado';

  const u = r.usuario;
  $('res-persona').style.display = u ? 'flex' : 'none';
  if (u) {
    const foto = $('res-foto');
    foto.onerror = () => { foto.onerror = null; foto.src = avatar(u.nombre); };
    foto.src = u.foto_url || avatar(u.nombre);
    $('res-nombre').textContent = u.nombre;           // textContent: nunca se interpreta como HTML
    $('res-detalle').textContent = [u.carrera, u.grupo ? 'Grupo ' + u.grupo : null, u.tipo]
      .filter(Boolean).join(' · ');
  }

  const motivo = r.motivo ? (MOTIVOS[r.motivo] || r.motivo)
               : (r.resultado === 'rechazado' ? MOTIVO_SIN_INGRESO : '');
  $('res-motivo').style.display = motivo ? 'block' : 'none';
  $('res-motivo').textContent = motivo;

  // permiso: null | {nombre, hasta} -> "🌙 Permiso: Hackatón hasta 08:00 (08/11)"
  const pm = r.permiso;
  $('res-permiso').style.display = pm ? 'inline-flex' : 'none';
  if (pm) {
    const h = String(pm.hasta || '').replace('T', ' ');
    // Icono fijo + texto con textContent (el nombre del permiso nunca se interpreta como HTML)
    $('res-permiso').innerHTML = ICONO_LUNA + '<span></span>';
    $('res-permiso').lastChild.textContent = `Permiso: ${pm.nombre} hasta ${h.slice(11, 16)} (${h.slice(8, 10)}/${h.slice(5, 7)})`;
  }

  // La hora viene como "YYYY-MM-DD HH:MM:SS"; mostramos HH:MM
  $('res-hora').textContent = r.fecha_hora ? String(r.fecha_hora).replace('T', ' ').slice(11, 16) : '';

  mostrar('pantalla-resultado');
  document.body.classList.add('mostrando');
  pitido(color);

  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    pantalla.className = 'pantalla';
    document.body.classList.remove('mostrando');
    mostrar('pantalla-espera');
    ocupado = false;
    enfocar();
  }, DURACION[color]);
}

/* Normaliza el código leído.
   El QR trae codigo_credencial de 12 caracteres, ej. "K7Q2-M9XD-4TPA".
   OJO: el lector USB "teclea" como teclado en inglés; si Windows está en
   español, el guion puede llegar como ' o ? y las letras en minúscula.
   Si quedan exactamente 12 letras/números, rearmamos "XXXX-XXXX-XXXX". */
function normalizarCodigo(txt) {
  // QR dinámico "D.<id>.<timestamp>.<firma>": la firma es hexadecimal en minúsculas
  // y el servidor la compara tal cual, así que NO se pasa a mayúsculas.
  const crudo = String(txt).trim();
  if (/^d\.\d+\.\d{13}\.[0-9a-f]{64}$/i.test(crudo)) {
    const p = crudo.split('.');
    return `D.${p[1]}.${p[2]}.${p[3].toLowerCase()}`;
  }
  const limpio = crudo.toUpperCase();
  const solo = limpio.replace(/[^A-Z0-9]/g, '');
  if (solo.length === 12 && /[^A-Z0-9]/.test(limpio)) {
    return `${solo.slice(0, 4)}-${solo.slice(4, 8)}-${solo.slice(8)}`;
  }
  return limpio;
}

/* Envía el código al servidor. "origen" (lector/camara) solo se usa para el log */
async function procesarCodigo(codigo, origen) {
  if (ocupado) return;           // la cámara lee varias veces por segundo; solo tomamos la primera
  ocupado = true;
  codigo = normalizarCodigo(codigo);
  console.log(`[kiosco] ${origen}: ${codigo}`);

  // Pantalla de "procesando" mientras responde el servidor (normalmente < 200 ms)
  $('pantalla-resultado').className = 'pantalla cargando';
  $('res-icono').innerHTML = '<div class="girador"></div>';
  document.body.classList.add('mostrando');
  $('res-titulo').textContent = 'Verificando';
  $('res-persona').style.display = 'none';
  $('res-motivo').style.display = 'none';
  $('res-permiso').style.display = 'none';
  $('res-hora').textContent = '';
  mostrar('pantalla-resultado');

  // AbortController: si el servidor se cuelga, no dejamos el kiosco congelado
  const control = new AbortController();
  const limite = setTimeout(() => control.abort(), TIEMPO_MAX_SERVIDOR);

  try {
    const resp = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo, kiosco_id: KIOSCO_ID, modo: MODO }),
      // foto_base64 es opcional en el contrato; se puede agregar después
      signal: control.signal
    });
    const datos = await resp.json();
    if (!resp.ok && !datos.resultado) throw new Error(datos.error || 'HTTP ' + resp.status);
    mostrarResultado(datos);
  } catch (err) {
    console.error('[kiosco] error en /api/scan:', err);
    mostrarResultado({ resultado: 'rechazado', color: 'rojo', motivo: 'sin_conexion', usuario: null, fecha_hora: null });
  } finally {
    clearTimeout(limite);
  }
}

/* =========================================================
   PASO 3: lectura con cámara (html5-qrcode)
   Lee QR y códigos de barras. El lector USB sigue funcionando
   al mismo tiempo: el input oculto nunca deja de tener el foco.
   ========================================================= */

let escaner = null;        // instancia de Html5Qrcode
let camaraActiva = false;

function mostrarAviso(texto) {
  const a = $('aviso');
  a.textContent = texto;
  a.classList.add('visible');
  setTimeout(() => a.classList.remove('visible'), 6000);
}

/* Cada vez que la cámara detecta un código llega aquí */
function alLeerConCamara(textoDecodificado) {
  procesarCodigo(textoDecodificado.trim(), 'camara');
}

async function iniciarCamara() {
  // La cámara del navegador solo funciona en HTTPS o en localhost
  if (!window.isSecureContext) {
    mostrarAviso('La cámara necesita HTTPS o localhost. Usa el lector USB o abre el kiosco con https://');
    return false;
  }

  const F = Html5QrcodeSupportedFormats;
  escaner = new Html5Qrcode('camara', {
    formatsToSupport: [F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8],
    useBarCodeDetectorIfSupported: true, // usa el detector nativo del navegador si existe (más rápido)
    verbose: false
  });

  const config = {
    fps: 10,
    // Recuadro rectangular: sirve para QR y también para códigos de barras (que son anchos)
    qrbox: (ancho, alto) => ({ width: Math.floor(ancho * 0.85), height: Math.floor(alto * 0.55) })
  };

  // Primero la cámara trasera; si no existe (laptop, tablet de frente), probamos la frontal
  const intentos = [{ facingMode: 'environment' }, { facingMode: 'user' }];
  for (const camara of intentos) {
    try {
      await escaner.start(camara, config, alLeerConCamara, () => {});
      return true;
    } catch (err) {
      if (err && /NotAllowed|Permission/i.test(String(err))) {
        mostrarAviso('Permiso de cámara denegado. Actívalo en el candado de la barra de direcciones.');
        return false;
      }
    }
  }
  mostrarAviso('No se pudo abrir la cámara.');
  return false;
}

async function detenerCamara() {
  if (!escaner) return;
  try { await escaner.stop(); escaner.clear(); } catch (e) { /* ya estaba detenida */ }
  escaner = null;
}

/* Alterna entre "Lector USB" y "Cámara" y recuerda la elección */
async function cambiarFuente(usarCamara) {
  if (usarCamara) {
    document.body.classList.add('modo-camara'); // muestra el recuadro antes de iniciar
    const ok = await iniciarCamara();
    if (!ok) {                                   // falló: volvemos al lector USB
      document.body.classList.remove('modo-camara');
      camaraActiva = false;
    } else {
      camaraActiva = true;
    }
  } else {
    await detenerCamara();
    document.body.classList.remove('modo-camara');
    camaraActiva = false;
  }
  pintarBotonModo();
  guardarLS('kiosco_fuente', camaraActiva ? 'camara' : 'lector');
  enfocar(); // el input oculto recupera el foco
}

/* Texto + icono del botón según la fuente que se puede activar */
function pintarBotonModo() {
  $('boton-modo').innerHTML = (camaraActiva ? ICONO_LECTOR : ICONO_CAMARA) +
    (camaraActiva ? 'Usar lector USB' : 'Usar cámara');
}
pintarBotonModo();

$('boton-modo').addEventListener('click', () => cambiarFuente(!camaraActiva));

/* Al abrir la página, retomar la última fuente usada (por defecto: lector USB).
   Nota: el navegador puede pedir permiso de cámara la primera vez. */
if (leerLS('kiosco_fuente') === 'camara') cambiarFuente(true);
</script>
