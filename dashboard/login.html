<!DOCTYPE html>
<!-- =====================================================================
     login.html — Entrada al panel para el personal de seguridad.
     Pide la clave (CLAVE_SEGURIDAD del servidor) y guarda la sesión de
     12 h en esta pestaña (js/sesion.js). Sin sesión, ninguna página del
     panel ni sus datos se pueden ver.
     ===================================================================== -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Aforo LinceCode</title>
  <meta name="theme-color" content="#8b1d46">
  <link rel="icon" href="img/uadeo-escudo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap">
  <style>
    :root {
      color-scheme: light;
      --guinda: #8b1d46; --guinda-oscuro: #6b1535; --profundo: #3a0f1f;
      --oro: #c8a23c; --oro-texto: #7a5a00; --crema: #faf5f0; --borde: #eadfd8;
      --texto: #2a2a2a; --suave: #6b5f63; --rojo: #b42318; --rojo-bg: #fdecea;
      --curva: cubic-bezier(.23, 1, .32, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px 16px;
      font: 400 15px/1.55 "Manrope", system-ui, "Segoe UI", sans-serif; color: var(--texto);
      background:
        radial-gradient(900px 420px at 50% -10%, #f6e7ec, transparent 70%),
        #ffffff;
      border-top: 4px solid var(--guinda);
      -webkit-font-smoothing: antialiased;
    }
    /* filete dorado bajo la línea guinda, como el encabezado de uadeo.mx */
    body::before { content: ""; position: fixed; inset: 4px 0 auto; height: 2px; background: var(--oro); }

    .acceso { width: min(400px, 100%); text-align: center; animation: sube 420ms var(--curva) backwards; }
    @keyframes sube { from { opacity: 0; transform: translateY(14px); } }

    .escudo {
      width: 132px; height: 132px; margin: 0 auto 20px; border-radius: 50%; display: grid; place-items: center;
      background: #fff; box-shadow: 0 0 0 1px var(--borde), 0 0 0 10px #fbf6f2, 0 18px 40px -18px rgb(58 15 31 / .35);
      animation: aparece 520ms var(--curva) 60ms backwards;
    }
    .escudo img { width: 104px; height: 104px; display: block; }
    @keyframes aparece { from { opacity: 0; transform: scale(.92); } }

    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--profundo); }
    .sub { margin: 6px 0 28px; color: var(--suave); }

    form {
      text-align: left; background: #fff; border: 1px solid var(--borde); border-radius: 18px; padding: 24px;
      box-shadow: 0 1px 2px rgb(58 15 31 / .04), 0 24px 48px -32px rgb(58 15 31 / .35);
      border-top: 3px solid var(--guinda);
    }
    form.error { animation: tiembla 320ms var(--curva); }
    @keyframes tiembla { 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }

    label { display: block; font-size: 13px; font-weight: 700; color: var(--profundo); margin-bottom: 6px; }
    .campo { position: relative; }
    input {
      width: 100%; min-height: 48px; padding: 10px 52px 10px 14px; border-radius: 12px;
      border: 1px solid #dcccc4; background: #fff; color: var(--texto); font: 500 16px/1 "Manrope", system-ui, sans-serif;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    input:focus { outline: none; border-color: var(--guinda); box-shadow: 0 0 0 4px rgb(139 29 70 / .14); }
    form.error input { border-color: var(--rojo); }
    .ver {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; border-radius: 10px;
      background: transparent; color: var(--suave); cursor: pointer; display: grid; place-items: center;
      transition: background 150ms ease, color 150ms ease;
    }
    .ver svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (hover: hover) and (pointer: fine) { .ver:hover { background: var(--crema); color: var(--guinda); } }
    .ver:focus-visible, button:focus-visible { outline: 2px solid var(--guinda); outline-offset: 2px; }

    .mensaje { min-height: 22px; margin: 10px 0 4px; font-size: 14px; color: var(--rojo); }
    .mensaje.info { color: var(--oro-texto); }

    .entrar {
      width: 100%; min-height: 50px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--guinda); color: #fff; font: 700 16px/1 "Manrope", system-ui, sans-serif;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 150ms ease, transform 160ms var(--curva);
    }
    @media (hover: hover) and (pointer: fine) { .entrar:hover { background: var(--guinda-oscuro); } }
    .entrar:active:not(:disabled) { transform: scale(.97); }
    .entrar:disabled { opacity: .75; cursor: wait; }
    .entrar .giro { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .35); border-top-color: #fff; animation: gira 700ms linear infinite; display: none; }
    .entrar:disabled .giro { display: block; }
    @keyframes gira { to { transform: rotate(360deg); } }

    .pie { margin: 22px 0 0; font-size: 13px; color: var(--suave); }
    .pie b { color: var(--guinda); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) {
      .acceso, .escudo, form.error { animation: none; }
      .entrar:active:not(:disabled) { transform: none; }
      .entrar .giro { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>
  <main class="acceso">
    <div class="escudo"><img src="img/uadeo-escudo.png" alt="Escudo de la Universidad Autónoma de Occidente" width="104" height="104"></div>
    <h1>Aforo LinceCode</h1>
    <p class="sub">Acceso para el personal de seguridad del Hackatón LinceCode 2026</p>

    <form id="form" novalidate>
      <label for="clave">Clave de acceso</label>
      <div class="campo">
        <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus aria-describedby="mensaje">
        <button class="ver" id="ver" type="button" aria-label="Mostrar la clave" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="mensaje" id="mensaje" role="alert"></p>
      <button class="entrar" id="entrar" type="submit"><span class="giro" aria-hidden="true"></span><span id="entrar-txt">Entrar al panel</span></button>
    </form>

    <p class="pie"><b>UAdeO</b> · Universidad Autónoma de Occidente</p>
  </main>

  <script src="js/sesion.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const form = $('form'), clave = $('clave'), msg = $('mensaje'), boton = $('entrar');
    const params = new URLSearchParams(location.search);
    // Solo se regresa a páginas del propio panel (nada de direcciones externas)
    const volver = /^[\w-]+\.html([?#].*)?$/.test(params.get('volver') || '') ? params.get('volver') : 'index.html';
    if (params.get('motivo') === 'vencida') { msg.textContent = 'Tu sesión terminó. Vuelve a entrar.'; msg.className = 'mensaje info'; }

    $('ver').addEventListener('click', e => {
      const mostrar = clave.type === 'password';
      clave.type = mostrar ? 'text' : 'password';
      e.currentTarget.setAttribute('aria-pressed', mostrar);
      e.currentTarget.setAttribute('aria-label', mostrar ? 'Ocultar la clave' : 'Mostrar la clave');
      clave.focus();
    });

    function error(texto) {
      msg.textContent = texto; msg.className = 'mensaje';
      form.classList.remove('error'); void form.offsetWidth; form.classList.add('error');
      clave.select();
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!clave.value.trim()) return error('Escribe la clave de acceso.');
      boton.disabled = true; $('entrar-txt').textContent = 'Entrando…'; msg.textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clave: clave.value }) });
        const datos = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(datos.error || 'No se pudo iniciar sesión.');
        Sesion.guardar(datos);
        location.replace(volver);
      } catch (err) {
        error(err instanceof TypeError ? 'Sin conexión con el servidor. Revisa que esté encendido.' : err.message);
        boton.disabled = false; $('entrar-txt').textContent = 'Entrar al panel';
      }
    });
  </script>
</body>
</html>
