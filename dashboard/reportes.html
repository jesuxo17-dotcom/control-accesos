<!DOCTYPE html>
<!-- =====================================================================
     reportes.html — Historial de entradas y salidas con filtros por
     fecha, carrera y usuario; exporta a CSV (se abre en Excel).
     Usa GET /api/eventos. Lógica en js/reportes.js
     ===================================================================== -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes de acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- sesión del panel: sin sesión manda a login.html antes de mostrar nada -->
  <script src="js/sesion.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="barra">
    <h1>Reportes</h1>
    <nav aria-label="Secciones">
      <a href="index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>En vivo</a>
      <a href="usuarios.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Usuarios</a>
      <a href="permisos.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>Permisos</a>
      <a href="tutores.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Tutores</a>
      <a href="reportes.html" class="activo" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Reportes</a>
    </nav>
  </header>

  <main id="contenido" tabindex="-1">
    <section class="tarjeta">
      <form id="filtros" class="filtros">
        <div><label for="desde">Desde</label><input type="date" id="desde"></div>
        <div><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
        <div><label for="carrera">Carrera</label><select id="carrera"><option value="">Todas</option></select></div>
        <div><label for="usuario_id">Usuario</label><select id="usuario_id"><option value="">Todos</option></select></div>
        <div><button class="primario" style="width:100%">Buscar</button></div>
        <div><button type="button" id="btn-csv" style="width:100%"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exportar CSV</button></div>
      </form>
      <p id="resumen" style="color:var(--suave);font-size:13px"></p>
      <div class="tabla-scroll">
        <table>
          <thead><tr><th>Fecha y hora</th><th>Nombre</th><th>Carrera</th><th>Tipo</th><th>Origen</th><th>Kiosco</th></tr></thead>
          <tbody id="tabla"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
